    <!-- The page stays hidden on the dark ground until the app has drawn itself with its styles
         (src/main.jsx adds .ready), then fades in whole: no unstyled flash when arriving from another page. -->
    <style>
      html { background: #0c0c0d; }
      #root { opacity: 0; transition: opacity 0.45s cubic-bezier(0.2, 0.7, 0.1, 1); }
      html.ready #root { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { #root { transition: none; } }
    </style>
